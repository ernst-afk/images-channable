name: BOXR DK-prijzen (DKK) verversen

on:
  schedule:
    - cron: "17 */3 * * *"   # elke 3 uur
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DKK-prijzen ophalen
        run: python scripts/dk_prices.py boxr-dk/prices-dkk.csv
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- boxr-dk/prices-dkk.csv; then
            echo "Geen prijswijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boxr-dk/prices-dkk.csv
          git commit -m "BOXR DK: DKK-prijzen bijgewerkt"
          git push
